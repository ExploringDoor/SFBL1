  <g fill="none" stroke="#c8322a" stroke-width="4.2" stroke-linecap="round">
    <path d="M13.5 13.5C22 21 25 30 24 40c-.6 6-3 11-6.5 15"/>
    <path d="M50.5 13.5C42 21 39 30 40 40c.6 6 3 11 6.5 15"/>
  </g>
  <g fill="#c8322a">
    <circle cx="18.5" cy="20" r="1.9"/><circle cx="21.5" cy="27" r="1.9"/>
    <circle cx="22.6" cy="34.5" r="1.9"/><circle cx="21.6" cy="42" r="1.9"/>
    <circle cx="45.5" cy="20" r="1.9"/><circle cx="42.5" cy="27" r="1.9"/>
    <circle cx="41.4" cy="34.5" r="1.9"/><circle cx="42.4" cy="42" r="1.9"/>
  </g>
</svg>
