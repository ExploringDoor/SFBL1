<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="544" viewBox="0 0 1600 544" role="img" aria-label="East Texas Basketball League">
  <defs>
    <linearGradient id="etblBg" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
    <radialGradient id="etblGlow" cx="288" cy="272" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="544" fill="url(#etblBg)"/>
  <!-- hairline accents in the accent orange -->
  <rect x="0" y="0" width="1600" height="5" fill="#c2410c"/>
  <rect x="0" y="539" width="1600" height="5" fill="#c2410c"/>

  <!-- glow behind the ball -->
  <ellipse cx="288" cy="272" rx="260" ry="260" fill="url(#etblGlow)"/>

  <!-- basketball -->
  <g transform="translate(288 272)">
    <circle r="150" fill="#c2410c"/>
    <path d="M-150 0 H150 M0 -150 V150" stroke="#071a33" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-106 -106 Q-10 0 -106 106 M106 -106 Q10 0 106 106" stroke="#071a33" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="560" y="215" font-size="46" font-weight="700" letter-spacing="10" fill="#f59e0b">EAST TEXAS</text>
    <text x="560" y="330" font-size="118" font-weight="900" letter-spacing="2">BASKETBALL</text>
    <text x="560" y="420" font-size="60" font-weight="800" letter-spacing="8" fill="#ffffff" opacity="0.92">LEAGUE</text>
    <text x="1040" y="420" font-size="34" font-weight="700" letter-spacing="6" fill="#f59e0b">2026-27 SEASON</text>
  </g>
</svg>
