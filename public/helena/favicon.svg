<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Helena Softball Association">
  <!-- Optic-yellow softball with red seams. Deliberately not the "HSA"
       wordmark: at 16px in a tab strip, three letters turn to mush, while a
       ball reads instantly and says "softball league" next to every other
       favicon in the row. The dark rim keeps it from disappearing into a
       light tab bar. -->
